<body class="bg-surface-container-low min-h-screen flex items-center justify-center p-4 antialiased">
<!-- Login Container Card -->
<div class="bg-on-tertiary w-full max-w-[28rem] rounded-xl shadow-sm border border-outline-variant p-8 md:p-10 relative overflow-hidden">
<!-- Subtle Top Accent Line -->
<div class="absolute top-0 left-0 w-full h-1 bg-primary"></div>
<!-- Header / Branding -->
<div class="text-center mb-8">
<div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-primary-fixed mb-5">
<span class="material-symbols-outlined text-on-primary-fixed-variant text-3xl" data-icon="water_drop" data-weight="fill" style="font-variation-settings: 'FILL' 1;">water_drop</span>
</div>
<h1 class="font-headline-md text-headline-md text-on-surface mb-1">J.A.S.S. QUILCATA</h1>
<p class="font-body-base text-body-base text-on-surface-variant">Gestión de Agua Potable</p>
</div>
<!-- Login Form -->
<form action="#" class="space-y-5" method="POST">
<!-- Floating Label Input: Username -->
<div class="relative">
<input class="peer block w-full rounded-lg border border-outline-variant bg-transparent px-4 pb-2.5 pt-6 font-body-base text-body-base text-on-surface focus:border-primary focus:outline-none focus:ring-1 focus:ring-primary transition-colors" id="username" name="username" placeholder=" " required="" type="text"/>
<label class="absolute left-4 top-4 z-10 origin-[0] -translate-y-2 scale-75 transform font-body-base text-body-base text-on-surface-variant duration-150 peer-placeholder-shown:translate-y-0 peer-placeholder-shown:scale-100 peer-focus:-translate-y-2 peer-focus:scale-75 peer-focus:text-primary pointer-events-none" for="username">
                    Nombre de usuario o email
                </label>
</div>
<!-- Floating Label Input: Password with Reveal -->
<div class="relative">
<input class="peer block w-full rounded-lg border border-outline-variant bg-transparent px-4 pb-2.5 pt-6 pr-12 font-body-base text-body-base text-on-surface focus:border-primary focus:outline-none focus:ring-1 focus:ring-primary transition-colors" id="password" name="password" placeholder=" " required="" type="password"/>
<label class="absolute left-4 top-4 z-10 origin-[0] -translate-y-2 scale-75 transform font-body-base text-body-base text-on-surface-variant duration-150 peer-placeholder-shown:translate-y-0 peer-placeholder-shown:scale-100 peer-focus:-translate-y-2 peer-focus:scale-75 peer-focus:text-primary pointer-events-none" for="password">
                    Contraseña
                </label>
<button aria-label="Toggle password visibility" class="absolute inset-y-0 right-0 flex items-center px-4 text-outline hover:text-on-surface focus:outline-none transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="visibility">visibility</span>
</button>
</div>
<!-- Remember Me & Forgot Password Layout -->
<div class="flex items-center justify-between pt-1 pb-2">
<div class="flex items-center">
<input class="h-4 w-4 rounded border-outline-variant text-primary focus:ring-primary focus:ring-offset-0 bg-transparent cursor-pointer" id="remember-me" name="remember-me" type="checkbox"/>
<label class="ml-2 block font-body-sm text-body-sm text-on-surface-variant cursor-pointer select-none" for="remember-me">
                        Recordarme
                    </label>
</div>
</div>
<!-- Submit Action -->
<button class="w-full flex justify-center items-center py-3 px-4 rounded-lg font-body-base text-body-base font-medium text-on-primary bg-primary hover:bg-on-primary-fixed-variant focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary focus:ring-offset-on-tertiary transition-all duration-200 shadow-sm active:scale-[0.98]" type="submit">
                Iniciar sesión
                <span class="material-symbols-outlined ml-2 text-[20px]" data-icon="login">login</span>
</button>
</form>
<!-- Footer Support Link -->
<div class="mt-8 pt-6 border-t border-surface-variant text-center">
<a class="inline-flex items-center font-body-sm text-body-sm text-primary hover:text-on-primary-fixed-variant hover:underline transition-colors focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 rounded px-2 py-1" href="#">
<span class="material-symbols-outlined mr-1.5 text-[18px]" data-icon="help">help</span>
                ¿Necesitas ayuda? Contacta al administrador
            </a>
</div>
</div>
